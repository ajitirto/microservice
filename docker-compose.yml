services:
  gateway:
    build:
      context: ./gateway
    container_name: microservice-gateway
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL: http://auth:8081
      USER_SERVICE_URL: http://user:8082
      POST_SERVICE_URL: http://post:8083
      NOTIFICATION_SERVICE_URL: http://notification:8084
    depends_on:
      - auth
      - user
      - post
      - notification

  auth:
    build:
      context: ./services/auth
    container_name: microservice-auth
    ports:
      - "8081:8081"

  user:
    build:
      context: ./services/user
    container_name: microservice-user
    ports:
      - "8082:8082"

  post:
    build:
      context: ./services/post
    container_name: microservice-post
    ports:
      - "8083:8083"

  notification:
    build:
      context: ./services/notification
    container_name: microservice-notification
    ports:
      - "8084:8084"

networks:
  default:
    name: microservice-network
