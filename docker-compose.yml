services:
  redis:
    image: redis:7-alpine
    container_name: microservice-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: microservice-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: ./gateway
    expose:
      - "8080"
    environment:
      AUTH_SERVICE_URL: "${AUTH_SERVICE_URL:-http://auth:8081}"
      USER_SERVICE_URL: "${USER_SERVICE_URL:-http://user:8082}"
      POST_SERVICE_URL: "${POST_SERVICE_URL:-http://post:8083}"
      NOTIFICATION_SERVICE_URL: "${NOTIFICATION_SERVICE_URL:-http://notification:8084}"
      AUTH_GRPC_ADDR: "${AUTH_GRPC_ADDR:-auth:9091}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      GATEWAY_RATE_LIMIT: "${GATEWAY_RATE_LIMIT:-60}"
      GATEWAY_TIMEOUT: "${GATEWAY_TIMEOUT:-10s}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    depends_on:
      - auth
      - user
      - post
      - notification

  haproxy:
    image: haproxy:2.9-alpine
    container_name: microservice-haproxy
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
      - "${HAPROXY_STATS_PORT:-8404}:8404"
    volumes:
      - ./deploy/docker/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - gateway

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: microservice-rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15

  auth:
    build:
      context: ./services/auth
    container_name: microservice-auth
    ports:
      - "${AUTH_PORT:-8081}:8081"
      - "${AUTH_GRPC_PORT:-9091}:9091"
    environment:
      AUTH_SECRET: "${AUTH_SECRET:-dev-secret-change-me}"
      ACCESS_TOKEN_TTL: "${ACCESS_TOKEN_TTL:-15m}"
      REFRESH_TOKEN_TTL: "${REFRESH_TOKEN_TTL:-24h}"
      DATABASE_URL: "${AUTH_DATABASE_URL:-postgres://postgres:postgres@postgres:5432/auth_db}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    depends_on:
      postgres:
        condition: service_healthy

  user:
    build:
      context: ./services/user
    ports:
      - "${USER_PORT:-8082}:8082"
      - "${USER_GRPC_PORT:-9090}:9090"
    environment:
      DATABASE_URL: "${USER_DATABASE_URL:-postgres://postgres:postgres@postgres:5432/user_db}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    depends_on:
      postgres:
        condition: service_healthy

  post:
    build:
      context: ./services/post
    ports:
      - "${POST_PORT:-8083}:8083"
    environment:
      NOTIFICATION_SERVICE_URL: "${NOTIFICATION_SERVICE_URL:-http://notification:8084}"
      USER_GRPC_ADDR: "${USER_GRPC_ADDR:-user:9090}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      RABBITMQ_URL: "${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}"
      DATABASE_URL: "${POST_DATABASE_URL:-postgres://postgres:postgres@postgres:5432/post_db}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    depends_on:
      postgres:
        condition: service_healthy

  notification:
    build:
      context: ./services/notification
    ports:
      - "${NOTIFICATION_PORT:-8084}:8084"
    environment:
      RABBITMQ_URL: "${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}"
      DATABASE_URL: "${NOTIFICATION_DATABASE_URL:-postgres://postgres:postgres@postgres:5432/notification_db}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: microservice-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9095}:9090"
    volumes:
      - ./deploy/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

networks:
  default:
    name: microservice-network

volumes:
  postgres_data: