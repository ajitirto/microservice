services:
  redis:
    image: redis:7-alpine
    container_name: microservice-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: ./gateway
    container_name: microservice-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      AUTH_SERVICE_URL: "${AUTH_SERVICE_URL:-http://auth:8081}"
      USER_SERVICE_URL: "${USER_SERVICE_URL:-http://user:8082}"
      POST_SERVICE_URL: "${POST_SERVICE_URL:-http://post:8083}"
      NOTIFICATION_SERVICE_URL: "${NOTIFICATION_SERVICE_URL:-http://notification:8084}"
      AUTH_GRPC_ADDR: "${AUTH_GRPC_ADDR:-auth:9091}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      GATEWAY_RATE_LIMIT: "${GATEWAY_RATE_LIMIT:-60}"
      GATEWAY_TIMEOUT: "${GATEWAY_TIMEOUT:-10s}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    depends_on:
      - auth
      - user
      - post
      - notification

  auth:
    build:
      context: ./services/auth
    container_name: microservice-auth
    ports:
      - "${AUTH_PORT:-8081}:8081"
      - "${AUTH_GRPC_PORT:-9091}:9091"
    environment:
      AUTH_SECRET: "${AUTH_SECRET:-dev-secret-change-me}"
      ACCESS_TOKEN_TTL: "${ACCESS_TOKEN_TTL:-15m}"
      REFRESH_TOKEN_TTL: "${REFRESH_TOKEN_TTL:-24h}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"

  user:
    build:
      context: ./services/user
    container_name: microservice-user
    ports:
      - "${USER_PORT:-8082}:8082"
      - "${USER_GRPC_PORT:-9090}:9090"
    environment:
      LOG_LEVEL: "${LOG_LEVEL:-info}"

  post:
    build:
      context: ./services/post
    container_name: microservice-post
    ports:
      - "${POST_PORT:-8083}:8083"
    environment:
      NOTIFICATION_SERVICE_URL: "${NOTIFICATION_SERVICE_URL:-http://notification:8084}"
      USER_GRPC_ADDR: "${USER_GRPC_ADDR:-user:9090}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"

  notification:
    build:
      context: ./services/notification
    container_name: microservice-notification
    ports:
      - "${NOTIFICATION_PORT:-8084}:8084"
    environment:
      LOG_LEVEL: "${LOG_LEVEL:-info}"

networks:
  default:
    name: microservice-network