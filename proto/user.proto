// user.proto defines the User Service internal API contract used by
// other services over gRPC. Single source of truth: generated code is
// vendored into each consuming service module.
syntax = "proto3";

package user.v1;

option go_package = "userpb";

service UserService {
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  string id = 1;
  string name = 2;
  string email = 3;
}