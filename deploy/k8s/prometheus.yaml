apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: poc
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: "gateway"
        static_configs:
          - targets: ["gateway:8080"]
      - job_name: "auth"
        static_configs:
          - targets: ["auth:8081"]
      - job_name: "user"
        static_configs:
          - targets: ["user:8082"]
      - job_name: "post"
        static_configs:
          - targets: ["post:8083"]
      - job_name: "notification"
        static_configs:
          - targets: ["notification:8084"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: poc
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090