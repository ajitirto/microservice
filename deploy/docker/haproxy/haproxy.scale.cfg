global
  log stdout format raw local0 info
  maxconn 4096

defaults
  log global
  mode http
  option httplog
  option dontlognull
  timeout connect 5s
  timeout client 60s
  timeout server 60s

frontend public
  bind *:8080
  default_backend gateway_servers

backend gateway_servers
  balance roundrobin
  option httpchk GET /health
  server gateway-1 microservice-gateway-1:8080 check inter 3s fall 3 rise 2
  server gateway-2 microservice-gateway2-1:8080 check inter 3s fall 3 rise 2

listen stats
  bind *:8404
  mode http
  stats enable
  stats uri /
  stats refresh 5s
