name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: ci (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, auth, user, post, notification]
    defaults:
      run:
        working-directory: ${{ matrix.service == 'gateway' && 'gateway' || format('services/{0}', matrix.service) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: "${{ matrix.service == 'gateway' && 'gateway' || format('services/{0}', matrix.service) }}/go.sum"

      - name: Check formatting
        id: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt=FAIL" >> "$GITHUB_OUTPUT"
            echo "gofmt_files<<EOF"
            echo "$out"
            echo "EOF"
            exit 0
          fi
          echo "gofmt=PASS" >> "$GITHUB_OUTPUT"

      - name: go vet
        id: vet
        run: |
          if go vet ./... 2>/tmp/vet.log; then
            echo "vet=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "vet=FAIL" >> "$GITHUB_OUTPUT"
            echo "vet_log<<EOF"
            cat /tmp/vet.log
            echo "EOF"
          fi

      - name: go build
        id: build
        run: |
          if go build ./...; then
            echo "build=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "build=FAIL" >> "$GITHUB_OUTPUT"
          fi

      - name: go test
        id: test
        run: |
          set +e
          go test -race -v -coverprofile=cover.out ./... > /tmp/test.log 2>&1
          status=$?
          set -e
          if [ $status -eq 0 ]; then
            echo "test=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "test=FAIL" >> "$GITHUB_OUTPUT"
          fi
          tests=$(grep -cE '^--- (PASS|FAIL):' /tmp/test.log || true)
          echo "tests=${tests:-0}" >> "$GITHUB_OUTPUT"
          coverage=$(go tool cover -func=cover.out 2>/dev/null | tail -1 | awk '{print $3; exit}' || echo "n/a")
          echo "coverage=${coverage:-n/a}" >> "$GITHUB_OUTPUT"
          if [ $status -ne 0 ]; then
            echo "failures<<EOF"
            grep -E '^(--- FAIL|FAIL|panic|\[FAIL\])' /tmp/test.log | head -15
            echo "EOF"
          fi

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: ci
    if: always()
    steps:
      - name: Render summary
        run: |
          json='${{ toJSON(needs.ci.outputs) }}'
          svcs="gateway auth user post notification"

          {
            echo "## CI Summary"
            echo ""
            echo "Run: \`${{ github.event_name }}\` on \`${{ github.ref_name }}\` @ \`${{ github.sha }}\`"
            echo ""
            echo "| Service | gofmt | vet | build | test (race) | tests | coverage |"
            echo "|---|---|---|---|---|---|---|"
          } > /tmp/summary.md

          overall=PASS
          for svc in $svcs; do
            line=""
            any_fail=0
            for field in gofmt vet build test; do
              v=$(echo "$json" | jq -r ".[\"${svc}_${field}\"] // \"-\"")
              case "$v" in
                PASS) cell=":white_check_mark:" ;;
                FAIL) cell=":x:"; any_fail=1 ;;
                *) cell="-" ;;
              esac
              line="$line|$cell"
            done
            tests=$(echo "$json" | jq -r ".[\"${svc}_tests\"] // \"-\"")
            cov=$(echo "$json" | jq -r ".[\"${svc}_coverage\"] // \"-\"")
            [ $any_fail -eq 1 ] && overall=FAIL
            echo "| $svc $line|$tests|$cov|" >> /tmp/summary.md
          done

          if [ "$overall" = "PASS" ]; then
            echo "" >> /tmp/summary.md
            echo ":tada: All services passed gofmt, vet, build and tests." >> /tmp/summary.md
          else
            echo "" >> /tmp/summary.md
            echo ":rotating_light: Failures detected — see the per-service job logs." >> /tmp/summary.md
          fi

          {
            echo ""
            echo "Triggered by: ${{ github.actor }} (${{ github.event.head_commit.message || 'workflow_dispatch' }})"
          } >> /tmp/summary.md

          cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$overall" = "FAIL" ]; then
            echo "One or more checks failed."
            exit 1
          fi